<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Lingual Desktop HUD</title>
  <link rel="stylesheet" href="hud.css">
</head>
<body>
  <div id="hud-container" class="hud-container">
    <!-- Header bar with totem and mode info -->
    <div class="hud-header">
      <div class="totem"><span class="totem-icon">⇄</span> [zh ⇄ en]</div>
      <div class="header-badges">
        <span id="badge-mode" class="badge">In-Situ</span>
        <button id="btn-close" class="btn-close" title="Dismiss (Esc)">✕</button>
      </div>
    </div>

    <!-- Spotlight input (visible only when triggered via Alt+Space) -->
    <div id="spotlight-box" class="spotlight-box hidden">
      <input id="spotlight-input" type="text" placeholder="Type thoughts in native language and press Enter..." autofocus autocomplete="off" />
    </div>

    <!-- Loading skeleton state -->
    <div id="loading-state" class="loading-state hidden">
      <div class="spinner"></div>
      <div class="loading-text">Polishing dual registers...</div>
    </div>

    <!-- Card layout (Trifecta Left-Rail Tree Branch) -->
    <div id="card-content" class="card-content">
      <!-- Source anchor -->
      <div class="branch-row branch-source">
        <span class="tree-bullet">·</span>
        <span class="tag tag-source">[Original]</span>
        <span id="text-source" class="branch-text"></span>
      </div>

      <!-- Slot 1: Spoken / Hook -->
      <div id="slot1-row" class="branch-row branch-slot branch-spoken interactive-slot" data-slot="1">
        <div class="key-badge">1</div>
        <span class="tree-glyph">┌</span>
        <span class="tag tag-spoken">[Spoken]</span>
        <div class="text-group">
          <div id="text-spoken" class="branch-text main-text"></div>
          <div id="meaning-spoken" class="sub-nuance"></div>
        </div>
      </div>

      <!-- Slot 2: Written / Tech -->
      <div id="slot2-row" class="branch-row branch-slot branch-written interactive-slot" data-slot="2">
        <div class="key-badge">2</div>
        <span class="tree-glyph">├</span>
        <span class="tag tag-written">[Written]</span>
        <div class="text-group">
          <div id="text-written" class="branch-text main-text"></div>
          <div id="meaning-written" class="sub-nuance"></div>
        </div>
      </div>

      <!-- Vocab stream -->
      <div id="vocab-row" class="branch-row branch-vocab">
        <span class="tree-glyph indent-glyph">└</span>
        <span class="tag tag-vocab">[Vocab]</span>
        <div id="text-vocab" class="branch-text vocab-stream"></div>
      </div>
    </div>

    <!-- Footer actions hint -->
    <div class="hud-footer">
      <span class="hint-item"><kbd>1</kbd> Spoken</span>
      <span class="hint-sep">·</span>
      <span class="hint-item"><kbd>2</kbd> Written</span>
      <span class="hint-sep">·</span>
      <span class="hint-item"><kbd>Esc</kbd> Cancel</span>
    </div>
  </div>

  <script src="hud.js"></script>
</body>
</html>
